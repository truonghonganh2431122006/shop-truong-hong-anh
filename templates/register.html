  <head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản - ShopOnline</title>
  <style>
  /* ========== CSS VARIABLES ========== */
  :root {
    --bg: #f8f8f8;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #64748b;
    --input-bg: #ffffff;
    --input-border: #e2e8f0;
    --primary: #f97316;
    --primary-dark: #ea580c;
    --error: #ef4444;
    --shadow: 0 25px 60px rgba(0,0,0,0.12);
    --glow: 0 0 0 3px rgba(249,115,22,0.25);
  }
  .dark {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text: #f1f5f9;
    --text-secondary: #94a3b8;
    --input-bg: #334155;
    --input-border: #475569;
    --shadow: 0 25px 60px rgba(0,0,0,0.4);
  }

  /* ========== RESET & BASE ========== */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
  }

  /* ========== ANIMATED GRADIENT BG ========== */
  .gradient-bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(135deg, #fb923c, #f97316, #ea580c, #fb923c);
    background-size: 300% 300%;
    animation: gradientShift 16s ease infinite;
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating orbs */
  .orb {
    position: fixed; border-radius: 50%; opacity: 0.12; z-index: 0;
    animation: floatOrb 8s ease-in-out infinite;
  }
  .orb:nth-child(1) { width:300px;height:300px;top:-80px;left:-80px;background:#f97316;animation-delay:0s; }
  .orb:nth-child(2) { width:200px;height:200px;bottom:10%;right:5%;background:#a855f7;animation-delay:2s; }
  .orb:nth-child(3) { width:250px;height:250px;top:40%;left:30%;background:#3b82f6;animation-delay:4s; }
  .orb:nth-child(4) { width:180px;height:180px;bottom:-60px;left:10%;background:#06b6d4;animation-delay:6s; }
  @keyframes floatOrb {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-30px) scale(1.05); }
  }

  /* ========== LAYOUT ========== */
  .container {
    position: relative; z-index: 1;
    display: flex; min-height: 100vh;
  }

  /* ========== LEFT BANNER ========== */
  .banner {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 3rem; color: #fff; position: relative; overflow: hidden;
  }
  .banner::before {
    content: ''; position: absolute; inset: 0;
    background: rgba(0,0,0,0.15);
  }
  .banner-content { position: relative; z-index: 1; text-align: center; }
  .banner-logo { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; display:flex;align-items:center;justify-content:center;gap:12px; }
  .banner-logo span { font-size: 2.8rem; }
  .banner-subtitle { font-size: 1.1rem; opacity: 0.9; max-width: 380px; line-height: 1.6; margin-bottom: 2rem; }
  .banner-illustration {
    width: 320px; height: 320px; border-radius: 24px;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    font-size: 8rem; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* ========== RIGHT FORM ========== */
  .form-section {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 2rem; background: var(--bg);
    transition: background 0.3s;
  }
  .form-card {
    width: 100%; max-width: 440px;
    background: var(--card-bg);
    border-radius: 20px; padding: 2.5rem;
    box-shadow: var(--shadow);
    animation: fadeInUp 0.7s ease-out;
    transition: background 0.3s, box-shadow 0.3s;
  }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(30px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* Dark mode toggle */
  .dark-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 99;
    width: 48px; height: 48px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 1.4rem;
    background: var(--card-bg); color: var(--text);
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transition: all 0.3s;
  }
  .dark-toggle:hover { transform: scale(1.1); }

  /* Mobile logo */
  .mobile-logo {
    display: none; text-align: center; margin-bottom: 1.5rem;
    font-size: 1.5rem; font-weight: 800; color: var(--primary);
  }
  .mobile-logo span { font-size: 1.8rem; }

  /* Form title */
  .form-title { font-size: 1.75rem; font-weight: 700; text-align: center; margin-bottom: 0.25rem; }

  /* ===== Các nút đăng ký nhanh (Facebook / Google / Email) — style giống Shopee ===== */
  #authMethods { display: flex; flex-direction: column; gap: 14px; margin-bottom: 4px; }
  .auth-method-btn {
    position: relative; width: 100%; padding: 14px 20px; border-radius: 14px;
    border: 1.5px solid var(--input-border); background: var(--card-bg); color: var(--text);
    font-size: 16px; font-weight: 500; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
  }
  .auth-method-btn:hover { border-color: var(--primary); background: var(--input-bg); }
  .auth-method-icon {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  }
  .auth-method-icon svg { width: 100%; height: 100%; }
  .auth-method-text { pointer-events: none; }

  .back-to-methods {
    display: flex; align-items: center; gap: 6px; background: none; border: none;
    color: var(--text-secondary); font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 0; margin-bottom: 18px;
  }
  .back-to-methods:hover { color: var(--primary); }
  .back-to-methods .ic { width: 18px; height: 18px; }

  .form-desc { text-align: center; color: var(--text-secondary); margin-bottom: 1.75rem; font-size: 0.95rem; }

  /* Input groups */
  .input-group { margin-bottom: 1.25rem; }
  .input-group label { display:block; font-size:0.875rem; font-weight:600; margin-bottom:6px; }
  .input-wrapper {
    position: relative; display: flex; align-items: center;
  }
  .input-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 1.1rem; color: var(--text-secondary); pointer-events: none;
    display: flex; align-items: center;
  }
  .input-wrapper input {
    width: 100%; padding: 14px 48px 14px 44px;
    border: 2px solid var(--input-border);
    border-radius: 12px; font-size: 0.95rem;
    background: var(--input-bg); color: var(--text);
    outline: none; transition: all 0.25s;
  }
  .input-wrapper input::placeholder { color: var(--text-secondary); }
  .input-wrapper input:focus {
    border-color: var(--primary);
    box-shadow: var(--glow);
  }
  .input-wrapper input.error { border-color: var(--error); }
  .input-wrapper input.error:focus { box-shadow: 0 0 0 3px rgba(239,68,68,0.2); }

  .toggle-pass {
    position: absolute; right: 14px; background: none;
    border: none; cursor: pointer; font-size: 1.2rem;
    color: var(--text-secondary); transition: color 0.2s;
  }
  .toggle-pass:hover { color: var(--text); }

  .error-msg {
    color: var(--error); font-size: 0.8rem; margin-top: 5px;
    display: flex; align-items: center; gap: 4px;
    animation: shakeIn 0.3s ease;
  }
  @keyframes shakeIn {
    0%,100% { transform:translateX(0); }
    25%     { transform:translateX(-5px); }
    75%     { transform:translateX(5px); }
  }

  /* Submit button */
  .btn-submit {
    width: 100%; padding: 15px; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #f97316, #ea580c);
    transition: all 0.3s; display: flex; align-items: center;
    justify-content: center; gap: 8px; margin-top: 0.5rem;
  }
  .btn-submit:hover:not(:disabled) {
    background: linear-gradient(135deg, #ea580c, #c2410c);
    box-shadow: 0 8px 25px rgba(249,115,22,0.4);
    transform: translateY(-2px);
  }
  .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

  /* Spinner */
  .spinner {
    width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Links */
  .form-footer {
    text-align: center; margin-top: 1.5rem;
    color: var(--text-secondary); font-size: 0.9rem;
  }
  .form-footer a {
    color: var(--primary); text-decoration: none; font-weight: 600;
  }
  .form-footer a:hover { text-decoration: underline; }

  /* Toast */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px);
    padding: 14px 28px; border-radius: 12px; font-weight: 600;
    color: #fff; z-index: 999; transition: transform 0.4s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 900px) {
    .banner { display: none; }
    .form-section { padding: 1.5rem; }
    .mobile-logo { display: block; }
  }
  
.ic { width: 18px; height: 18px; stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  flex-shrink: 0; vertical-align: middle; display: inline-block; }
.ic-lg { width: 34px; height: 34px; }
.ic-xl { width: 56px; height: 56px; }
.btn-icon-row { display: inline-flex; align-items: center; gap: 8px; }
</style>

  <!-- Animated background -->
  <div class="gradient-bg"></div>
  <div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div>

  <!-- Dark mode toggle -->

  <div class="container">

        <div class="banner-illustration"><svg class="ic" style="width:96px;height:96px" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>

    <!-- Right Form -->

        <div class="mobile-logo"><span class="btn-icon-row"><svg class="ic" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> ShopOnline</span></div>

        <p class="form-desc">Đăng ký để bắt đầu mua sắm!</p>

        <div id="authMethods">

                <path fill="#FFFFFF" d="M25.02,23.13L25.78,18h-4.75v-3.34c0-1.36,0.67-2.68,2.79-2.68h2.16V7.76c0,0-1.96-0.33-3.83-0.33c-3.91,0-6.46,2.37-6.46,6.65V18h-4.34v5.13h4.34v12.63c0.87,0.14,1.76,0.21,2.67,0.21s1.8-0.07,2.67-0.21V23.13H25.02z"/>

                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>

<script>
/* ========== CÁC BIẾN GIAO DIỆN ========== */
const registerForm = document.getElementById('registerForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirmPassword');
const submitBtn = document.getElementById('submitBtn');
const toast = document.getElementById('toast');

const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

/* ========== DARK MODE & TOGGLE PASS (Giữ nguyên tính năng đẹp của bạn) ========== */
function toggleDark() {
  document.documentElement.classList.toggle('dark');
  const btn = document.querySelector('.dark-toggle');
  btn.innerHTML = document.documentElement.classList.contains('dark') ? `<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>` : `<svg class="ic" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
}

function togglePassword(id, btn) {
  const input = document.getElementById(id);
  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';
  btn.innerHTML = isPassword ? `<svg class="ic" viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>` : `<svg class="ic" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
}

/* ========== HIỂN THỊ LỖI TRÊN TỪNG Ô NHẬP ========== */
function showError(id, msg) {
  const el = document.getElementById(id);
  el.innerHTML = `<svg class="ic" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ` + msg;
  el.style.display = 'flex';
  const input = document.getElementById(id.replace('Error', '').replace('confirm', 'confirmPassword'));
  if(input) input.classList.add('error');
}

function clearError(id) {
  const el = document.getElementById(id);
  el.style.display = 'none';
  const input = document.getElementById(id.replace('Error', '').replace('confirm', 'confirmPassword'));
  if(input) input.classList.remove('error');
}

/* ========== THÔNG BÁO TOAST XỊN ========== */
function showToast(msg, type) {
  toast.textContent = msg;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ========== HIỆN/ẨN FORM EMAIL + MẬT KHẨU ========== */

/* ========== ĐĂNG KÝ / ĐĂNG NHẬP BẰNG GOOGLE ========== */
// Dùng Google Identity Services (token client) để tự thiết kế giao diện nút,
// không dùng khung nút mặc định của Google. Email đã được Google xác thực
// nên không cần qua bước nhập mã OTP nữa.
let googleTokenClient = null;
function handleGoogleLoginClick() {
  if (!googleTokenClient) {
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: '298853881583-kfpga0mtsfqlpiasje295jd95u71l45s.apps.googleusercontent.com',
      scope: 'openid email profile',
      callback: (tokenResponse) => {
        if (tokenResponse && tokenResponse.access_token) {
          handleGoogleLoginResponse(tokenResponse.access_token);
        } else {
          showToast('❌ Đăng nhập Google thất bại', 'error');
        }
      },
    });
  }
  googleTokenClient.requestAccessToken();
}

async function handleGoogleLoginResponse(accessToken) {
  try {
    const res = await fetch("/auth/google-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ access_token: accessToken })
    });
    const data = await res.json();

    if (res.ok && data.success === true) {
      localStorage.setItem("access_token", data.access_token);
      localStorage.setItem("token", data.access_token);
      if (data.user) {
        localStorage.setItem("user_email", data.user.email);
        localStorage.setItem("currentUser", JSON.stringify(data.user));
        if (data.user.id) localStorage.setItem("user_id", data.user.id);
      }
      showToast('✅ Đăng nhập bằng Google thành công!', 'success');
      setTimeout(() => { window.location.href = data.redirect; }, 1000);
    } else {
      showToast('❌ ' + (data.message || data.detail || 'Đăng nhập Google thất bại'), 'error');
    }
  } catch (err) {
    showToast('❌ Không thể kết nối đến máy chủ!', 'error');
  }
}

/* ========== ĐĂNG KÝ / ĐĂNG NHẬP BẰNG FACEBOOK ========== */
function handleFacebookLoginClick() {
    FB.login(function(response) {
        if (response.authResponse) {
            handleFacebookLoginResponse(response.authResponse.accessToken);
        } else {
            showToast('❌ Bạn đã huỷ đăng nhập Facebook', 'error');
        }
    }, { scope: 'public_profile,email' });
}

    try {
        const res = await fetch("/auth/facebook-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },

        if (res.ok && data.success === true) {

/* ========== XỬ LÝ ĐĂNG KÝ KẾT NỐI SERVER ========== */
registerForm.addEventListener('submit', async function(e) {
  e.preventDefault();

  // 1. Lấy dữ liệu
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const confirm = confirmInput.value;

  // 2. Kiểm tra nhanh (Validation)
  let hasError = false;
  if (!email || !emailRegex.test(email)) { showError('emailError', 'Email không hợp lệ'); hasError = true; } else { clearError('emailError'); }
  if (password.length < 6) { showError('passwordError', 'Mật khẩu tối thiểu 6 ký tự'); hasError = true; } else { clearError('passwordError'); }
  if (confirm !== password) { showError('confirmError', 'Mật khẩu xác nhận không khớp'); hasError = true; } else { clearError('confirmError'); }

  if (hasError) return;

  // 3. Trạng thái Loading
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<div class="spinner"></div> Đang gửi mã OTP...';

  try {
    // 4. Gửi yêu cầu OTP đến Server Python (chưa tạo tài khoản ngay,
    // chỉ tạo thật sau khi người dùng xác thực đúng mã OTP)
    const res = await fetch("/auth/send-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
      // THÀNH CÔNG: đã gửi OTP, chuyển sang trang nhập mã
      showToast('📧 ' + (data.message || 'Đã gửi mã OTP đến email!'), 'success');

      setTimeout(() => {
        window.location.href = "/verify-otp?email=" + encodeURIComponent(email);
      }, 1500);

    } else {
      // THẤT BẠI (Ví dụ: Email đã tồn tại)
      showToast('❌ ' + (data.detail || 'Đăng ký thất bại, thử lại sau'), 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Đăng ký';
    }

  } catch (err) {
    // LỖI KẾT NỐI
    showToast('❌ Không thể kết nối đến máy chủ!', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Đăng ký';
  }
});

/* ========== XÓA LỖI KHI ĐANG GÕ ========== */
[emailInput, passwordInput, confirmInput].forEach(input => {
    input.addEventListener('input', () => {
        const errorId = input.id === 'confirmPassword' ? 'confirmError' : input.id + 'Error';
        clearError(errorId);
    });
});
