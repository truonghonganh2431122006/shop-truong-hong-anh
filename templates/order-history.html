<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Theo dõi đơn hàng - Trương Hồng Anh Shop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            min-height: 100vh;
            color: #1a1a2e;
            padding: 0;
        }

        /* --- Top Bar --- */
        .top-bar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 30px rgba(0,0,0,0.15);
        }
        .top-bar-inner {
            max-width: 720px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .top-bar h1 {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }
        .top-bar h1 span {
            color: #f0c040;
        }

        .container { max-width: 720px; margin: auto; padding: 24px 16px 80px; }

        /* --- Back Button --- */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            background: #fff;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 24px;
            transition: all 0.25s cubic-bezier(.4,0,.2,1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.06);
        }
        .btn-back:hover {
            background: #1a1a2e;
            color: #fff;
            box-shadow: 0 4px 16px rgba(26,26,46,0.2);
            transform: translateY(-1px);
        }
        .btn-back i { font-style: normal; font-size: 16px; }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .page-subtitle {
            font-size: 14px;
            color: #8892a4;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* --- Order Card --- */
        .order-card {
            background: #fff;
            padding: 0;
            margin-bottom: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.04);
            transition: all 0.3s cubic-bezier(.4,0,.2,1);
            overflow: hidden;
            position: relative;
        }
        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
        }

        /* --- Order Header --- */
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 24px 16px;
            background: linear-gradient(180deg, #fafbfc 0%, #fff 100%);
            border-bottom: 1px solid #f0f1f3;
        }
        .order-id {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.3px;
        }
        .order-date {
            font-size: 12px;
            color: #a0a8b8;
            margin-top: 4px;
            font-weight: 400;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 24px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
        }
        /* Chờ xác nhận - Vàng */
        .status-wait {
            background: linear-gradient(135deg, #fff8e1, #fff3cd);
            color: #9a7b10;
            border: 1px solid #f0d860;
        }
        /* Đã xác nhận - Xanh dương */
        .status-confirmed {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            color: #1565c0;
            border: 1px solid #90caf9;
        }
        /* Đang giao - Cam */
        .status-ship {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            color: #e65100;
            border: 1px solid #ffcc80;
        }
        /* Đã giao / Hoàn thành - Xanh lá */
        .status-done {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        /* Đã hủy - Đỏ */
        .status-cancel {
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        /* --- Product List --- */
        .product-list {
            margin: 0;
            padding: 12px 24px;
            list-style: none;
        }
        .product-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f7;
        }
        .product-item:last-child { border-bottom: none; }

        .product-img {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            object-fit: cover;
            background: #f0f1f3;
            flex-shrink: 0;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .product-info { flex: 1; min-width: 0; }
        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-qty {
            font-size: 12px;
            color: #8892a4;
            font-weight: 500;
            margin-top: 2px;
        }
        .product-price {
            font-size: 15px;
            color: #e53935;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* --- Shipping Info --- */
        .shipping-info {
            margin: 0 24px 4px;
            padding: 14px 16px;
            background: #f8f9fb;
            border-radius: 12px;
            font-size: 13px;
            color: #5a6478;
            line-height: 1.6;
            border: 1px solid #eef0f4;
        }
        .shipping-info .ship-icon {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .shipping-info .ship-detail {
            color: #6b7a90;
            font-size: 12.5px;
        }

        /* --- Order Footer --- */
        .order-footer {
            padding: 16px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f0f1f3;
            margin-top: 8px;
        }
        .total-label {
            font-size: 13px;
            color: #8892a4;
            font-weight: 500;
        }
        .total-amount {
            font-size: 24px;
            color: #e53935;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* --- Cancel Button --- */
        .btn-cancel {
            background: #fff;
            color: #e53935;
            border: 1.5px solid #ffcdd2;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(.4,0,.2,1);
            font-family: inherit;
        }
        .btn-cancel:hover {
            background: #e53935;
            color: #fff;
            border-color: #e53935;
            box-shadow: 0 4px 12px rgba(229,57,53,0.25);
            transform: translateY(-1px);
        }

        /* --- Empty & Loading States --- */
        .state-box {
            text-align: center;
            padding: 60px 24px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }
        .state-box .state-icon { font-size: 56px; display: block; margin-bottom: 16px; }
        .state-box p { color: #8892a4; font-size: 15px; margin-bottom: 20px; font-weight: 400; }
        .state-box a, .state-box button {
            display: inline-block;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            padding: 12px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .state-box a:hover, .state-box button:hover {
            box-shadow: 0 6px 20px rgba(26,26,46,0.2);
            transform: translateY(-2px);
        }

        /* --- Responsive --- */
        @media (max-width: 480px) {
            .container { padding: 16px 12px 60px; }
            .page-title { font-size: 22px; }
            .order-header { padding: 16px 16px 12px; flex-wrap: wrap; gap: 8px; }
            .product-list { padding: 8px 16px; }
            .product-img { width: 48px; height: 48px; border-radius: 10px; }
            .product-name { font-size: 13px; }
            .product-price { font-size: 14px; }
            .order-footer { padding: 12px 16px 16px; flex-direction: column; gap: 12px; align-items: stretch; }
            .order-footer > div:last-child { text-align: right; }
            .total-amount { font-size: 20px; }
            .shipping-info { margin: 0 16px 4px; }
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0d4dc; border-radius: 3px; }

        /* --- Animation --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .order-card { animation: fadeUp 0.4s ease-out both; }
        .order-card:nth-child(2) { animation-delay: 0.06s; }
        .order-card:nth-child(3) { animation-delay: 0.12s; }
        .order-card:nth-child(4) { animation-delay: 0.18s; }
        .order-card:nth-child(5) { animation-delay: 0.24s; }

        /* ─── REVIEW BOX ─── */
        .review-box {
            margin: 0 16px 16px;
            padding: 16px;
            background: linear-gradient(135deg, #fffbeb, #fefce8);
            border: 1.5px solid #fde68a;
            border-radius: 14px;
        }
        .review-box.done {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border-color: #86efac;
        }
        .review-title {
            font-size: 13px; font-weight: 700; color: #92400e;
            margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
        }
        .review-box.done .review-title { color: #166534; }
        .stars-row {
            display: flex; gap: 6px; margin-bottom: 12px;
        }
        .star-btn {
            font-size: 26px; background: none; border: none; cursor: pointer;
            transition: transform 0.15s; line-height: 1; padding: 0;
            filter: grayscale(1); opacity: 0.35;
        }
        .star-btn.active { filter: none; opacity: 1; transform: scale(1.18); }
        .star-btn:hover  { filter: none; opacity: 0.8; transform: scale(1.12); }
        .review-textarea {
            width: 100%; padding: 10px 12px;
            border: 1.5px solid #fde68a; border-radius: 10px;
            font-size: 13px; font-family: inherit; resize: none;
            background: #fff; color: #1a1a2e; outline: none;
            transition: border-color 0.2s; min-height: 72px;
        }
        .review-textarea:focus { border-color: #f59e0b; }
        .review-submit {
            margin-top: 10px; padding: 10px 24px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff; font-weight: 700; font-size: 13px;
            border: none; border-radius: 20px; cursor: pointer;
            font-family: inherit; transition: all 0.2s;
            box-shadow: 0 3px 12px rgba(217,119,6,0.3);
        }
        .review-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(217,119,6,0.4); }
        .review-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .review-done-stars { font-size: 22px; letter-spacing: 2px; margin-bottom: 6px; }
        .review-done-comment {
            font-size: 13px; color: #374151; font-style: italic;
            background: #fff; border-radius: 8px; padding: 8px 12px;
            border: 1px solid #bbf7d0; margin-top: 6px;
        }
        .review-done-date { font-size: 11px; color: #6b7280; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner">
            <h1><span>✦</span> Trương Hồng Anh Shop</h1>
        </div>
    </div>

    <div class="container">
        <a href="/shop" class="btn-back"><i>←</i>Quay lại mua sắm</a>

        <div class="page-title">Đơn hàng của tôi</div>
        <p class="page-subtitle">Theo dõi và quản lý tất cả đơn hàng của bạn</p>

        <div id="orderList"></div>
    </div>

    <script>
        /* ══════════════════════════════════════════════════════
           HELPER: Đọc an toàn từ localStorage, luôn trả về Array
           ══════════════════════════════════════════════════════ */
        function safeGetArray(key) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                console.warn('[order-history] Lỗi đọc localStorage key "' + key + '":', e);
                return [];
            }
        }

        /* ══════════════════════════════════════════════════════
           HELPER: Lấy ID an toàn từ object đơn hàng
           ══════════════════════════════════════════════════════ */
        function safeOrderId(o) {
            return String(o.id || o.order_id || o.code || ('U' + Math.random().toString(36).slice(2, 8)));
        }

        /* ══════════════════════════════════════════════════════
           HELPER: Lấy ảnh sản phẩm an toàn (fallback chain)
           ══════════════════════════════════════════════════════ */
        function safeProductImage(item) {
            const fallback = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 56%22%3E%3Crect fill=%22%23f0f1f3%22 width=%2256%22 height=%2256%22/%3E%3Ctext x=%2228%22 y=%2232%22 text-anchor=%22middle%22 font-size=%2220%22%3E📦%3C/text%3E%3C/svg%3E';
            if (!item) return fallback;
            // Thử tất cả các key phổ biến
            const src = item.image || item.img || item.thumbnail || item.photo
                || (item.product && (item.product.image || item.product.img))
                || '';
            return src || fallback;
        }

        /* ══════════════════════════════════════════════════════
           MAIN: Hiển thị đơn hàng
           ══════════════════════════════════════════════════════ */
        async function displayOrders() {
            const container = document.getElementById('orderList');
            if (!container) return;

            const token = localStorage.getItem('access_token');

            /* ── Nếu chưa đăng nhập và không có đơn local ── */
            if (!token) {
                // Vẫn kiểm tra localStorage cho guest orders
                const allLocal = [
                    ...safeGetArray('ha_quick_orders'),
                    ...safeGetArray('user_orders'),
                    ...safeGetArray('ha_orders'),
                    ...safeGetArray('cart_orders')
                ];
                if (allLocal.length === 0) {
                    container.innerHTML = `
                        <div class="state-box">
                            <span class="state-icon">🔒</span>
                            <p>Vui lòng đăng nhập để xem đơn hàng của bạn</p>
                            <a href="/login">Đăng nhập ngay</a>
                        </div>`;
                    return;
                }
            }

            let apiOrders = [];
            let localOrders = [];

            /* ── 1. Lấy đơn hàng từ API nếu đã đăng nhập ── */
            if (token) {
                try {
                    const res = await fetch('/orders/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        apiOrders = Array.isArray(data) ? data : [];
                    }
                } catch (e) {
                    console.warn('[order-history] Lỗi fetch /orders/me:', e);
                }
            }

            /* ── 2. Lấy đơn hàng từ TẤT CẢ các key localStorage ── */
            try {
                const keys = ['ha_quick_orders', 'user_orders', 'ha_orders', 'cart_orders'];
                keys.forEach(function(key) {
                    const arr = safeGetArray(key);
                    arr.forEach(function(o) { localOrders.push(o); });
                });
            } catch (e) {
                console.warn('[order-history] Lỗi đọc localStorage orders:', e);
            }

            /* ── 3. Gộp và loại bỏ đơn trùng lặp ── */
            const orderMap = new Map();

            // API orders ưu tiên cao hơn (có dữ liệu chính xác nhất)
            (apiOrders || []).forEach(function(o) {
                const key = safeOrderId(o);
                o._displayId = key; // Lưu ID hiển thị
                orderMap.set(key, o);
            });

            // Local orders chỉ thêm nếu chưa có từ API
            (localOrders || []).forEach(function(o) {
                const key = safeOrderId(o);
                if (!orderMap.has(key)) {
                    o._displayId = key;
                    orderMap.set(key, o);
                }
            });

            const orders = Array.from(orderMap.values());

            /* ── 4. Kiểm tra nếu không có đơn hàng ── */
            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="state-box">
                        <span class="state-icon">📦</span>
                        <p>Bạn chưa có đơn hàng nào</p>
                        <a href="/shop">Mua sắm ngay!</a>
                    </div>`;
                return;
            }

            /* ── 5. Render từng đơn hàng ── */
            let html = '';
            const reviewOrderIds = []; // Collect IDs for review status check

            orders.forEach(function(order) {
                try {
                    const orderId = order._displayId || safeOrderId(order);
                    const status = order.status || 'Chờ xác nhận';

                    let statusClass = 'status-wait';
                    if (status === 'Đã xác nhận') statusClass = 'status-confirmed';
                    if (status === 'Đang giao') statusClass = 'status-ship';
                    if (status === 'Đã giao' || status === 'Hoàn thành') statusClass = 'status-done';
                    if (status === 'Đã hủy') statusClass = 'status-cancel';

                    const items = Array.isArray(order.items) ? order.items : [];
                    const itemsHtml = items.map(function(item) {
                        const displayItemPrice = item.unit_price || item.price || 0;
                        const imgSrc = safeProductImage(item);
                        const fallbackSvg = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 56%22%3E%3Crect fill=%22%23f0f1f3%22 width=%2256%22 height=%2256%22/%3E%3Ctext x=%2228%22 y=%2232%22 text-anchor=%22middle%22 font-size=%2220%22%3E📦%3C/text%3E%3C/svg%3E';
                        return '<li class="product-item">' +
                            '<img class="product-img" src="' + imgSrc + '" alt="' + (item.name || '') + '" onerror="this.src=\'' + fallbackSvg + '\'" />' +
                            '<div class="product-info">' +
                                '<div class="product-name">' + (item.name || 'Sản phẩm') + '</div>' +
                                '<div class="product-qty">Số lượng: ' + (item.qty || item.quantity || 1) + '</div>' +
                            '</div>' +
                            '<span class="product-price">' + displayItemPrice.toLocaleString() + 'đ</span>' +
                        '</li>';
                    }).join('');

                    const addrHtml = (order.shipping_address || order.customer_name) ?
                        '<div class="shipping-info">' +
                            '<div class="ship-icon">📍 Thông tin giao hàng</div>' +
                            '<div class="ship-detail">' +
                                '<strong>' + (order.customer_name || '') + '</strong>' +
                                ((order.customer_name && order.phone_number) ? ' · ' : '') +
                                (order.phone_number || '') +
                                (order.shipping_address ? '<br>' + order.shipping_address : '') +
                            '</div>' +
                        '</div>' : '';

                    const canCancel = status === 'Chờ xác nhận';
                    const cancelBtn = canCancel
                        ? '<button class="btn-cancel" onclick="cancelOrder(\'' + orderId + '\')">✕ Hủy đơn</button>'
                        : '<div></div>';

                    const discountAmt = order.discount_amount || order.discountAmount || 0;
                    const discountHtml = discountAmt > 0
                        ? '<span style="font-size:11px;color:#276749;font-weight:600;margin-left:6px;background:#f0fff4;padding:2px 8px;border-radius:10px;border:1px solid #9ae6b4">🏷️ Đã giảm ' + discountAmt.toLocaleString() + 'đ</span>'
                        : '';

                    const totalAmount = order.final_total || order.total || 0;

                    const isDone = status === 'Đã giao' || status === 'Hoàn thành';
                    let reviewHtml = '';
                    if (isDone) {
                        // Chỉ load review cho đơn từ API (có ID số)
                        if (typeof order.id === 'number' || (typeof orderId === 'string' && /^\d+$/.test(orderId))) {
                            reviewOrderIds.push(orderId);
                        }
                        reviewHtml = '<div class="review-box" id="review-box-' + orderId + '">' +
                            '<div class="review-title">⭐ Đánh giá đơn hàng này</div>' +
                            '<div class="stars-row" id="stars-' + orderId + '">' +
                                [1,2,3,4,5].map(function(s) {
                                    return '<button class="star-btn" data-val="' + s + '" onclick="setStar(\'' + orderId + '\',' + s + ')">★</button>';
                                }).join('') +
                            '</div>' +
                            '<textarea class="review-textarea" id="comment-' + orderId + '" placeholder="Nhận xét của bạn về đơn hàng này (tùy chọn)..." rows="3"></textarea>' +
                            '<button class="review-submit" id="submit-review-' + orderId + '" onclick="submitReview(\'' + orderId + '\')">Gửi đánh giá ⭐</button>' +
                        '</div>';
                    }

                    html += '<div class="order-card">' +
                        '<div class="order-header">' +
                            '<div>' +
                                '<div class="order-id">Đơn #' + orderId + '</div>' +
                                '<div class="order-date">' + (order.date || order.created_at || 'N/A') + '</div>' +
                            '</div>' +
                            '<span class="status-badge ' + statusClass + '">' + status + '</span>' +
                        '</div>' +
                        '<ul class="product-list">' + itemsHtml + '</ul>' +
                        addrHtml +
                        '<div class="order-footer">' +
                            '<div>' + cancelBtn + '</div>' +
                            '<div style="text-align:right;">' +
                                '<div class="total-label">Tổng thanh toán' + discountHtml + '</div>' +
                                '<div class="total-amount">' + totalAmount.toLocaleString() + 'đ</div>' +
                            '</div>' +
                        '</div>' +
                        reviewHtml +
                    '</div>';
                } catch (orderErr) {
                    console.error('[order-history] Lỗi render đơn hàng:', orderErr, order);
                }
            });

            container.innerHTML = html;

            // Load review status cho các đơn đã hoàn thành
            reviewOrderIds.forEach(function(oid) {
                loadReviewStatus(oid);
            });
        }

        async function cancelOrder(orderId) {
            if (!confirm('Bạn chắc chắn muốn hủy đơn #' + orderId + '?')) return;
            const token = localStorage.getItem('access_token');
            try {
                const res = await fetch('/admin/orders/' + orderId + '/status?new_status=' + encodeURIComponent('Đã hủy'), {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    alert('✅ Đã hủy đơn #' + orderId);
                    displayOrders();
                } else {
                    const err = await res.json().catch(function() { return {}; });
                    alert('Không thể hủy đơn: ' + (err.detail || 'Vui lòng thử lại!'));
                }
            } catch (err) {
                alert('Lỗi kết nối server!');
            }
        }


        // ─── REVIEW FUNCTIONS ───
        var reviewStars = {};

        function setStar(orderId, val) {
            reviewStars[orderId] = val;
            var btns = document.querySelectorAll('#stars-' + orderId + ' .star-btn');
            btns.forEach(function(b) {
                if (parseInt(b.dataset.val) <= val) b.classList.add('active');
                else b.classList.remove('active');
            });
        }

        async function loadReviewStatus(orderId) {
            try {
                const res = await fetch('/orders/' + orderId + '/review');
                if (!res.ok) return;
                const data = await res.json();
                if (data.reviewed) {
                    renderReviewDone(orderId, data.rating, data.comment, data.created_at);
                }
            } catch(e) {}
        }

        function renderReviewDone(orderId, rating, comment, date) {
            const box = document.getElementById('review-box-' + orderId);
            if (!box) return;
            const stars = '★'.repeat(rating) + '☆'.repeat(5 - rating);
            box.classList.add('done');
            box.innerHTML =
                '<div class="review-title">✅ Đã đánh giá</div>' +
                '<div class="review-done-stars" style="color:#f59e0b">' + stars + '</div>' +
                (comment ? '<div class="review-done-comment">"' + comment + '"</div>' : '') +
                '<div class="review-done-date">Gửi lúc ' + date + '</div>';
        }

        async function submitReview(orderId) {
            const rating = reviewStars[orderId];
            if (!rating) { alert('Vui lòng chọn số sao!'); return; }
            const comment = document.getElementById('comment-' + orderId).value.trim();
            const btn = document.getElementById('submit-review-' + orderId);
            const token = localStorage.getItem('access_token');

            btn.disabled = true;
            btn.textContent = '⏳ Đang gửi...';

            try {
                const res = await fetch('/orders/' + orderId + '/review', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ rating: rating, comment: comment })
                });
                const data = await res.json();
                if (res.ok) {
                    const now = new Date().toLocaleString('vi-VN');
                    renderReviewDone(orderId, rating, comment, now);
                } else {
                    alert(data.detail || 'Gửi đánh giá thất bại!');
                    btn.disabled = false;
                    btn.textContent = 'Gửi đánh giá ⭐';
                }
            } catch(e) {
                alert('Lỗi kết nối!');
                btn.disabled = false;
                btn.textContent = 'Gửi đánh giá ⭐';
            }
        }

        /* ══════════════════════════════════════════════════════
           INIT: Tải dữ liệu khi mở trang
           ══════════════════════════════════════════════════════ */
        document.addEventListener('DOMContentLoaded', function() {
            displayOrders();
            // Tự cập nhật đơn hàng mỗi 30 giây
            setInterval(displayOrders, 30000);
        });
    </script>
</body>
</html>
